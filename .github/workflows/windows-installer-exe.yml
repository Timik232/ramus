name: Windows EXE installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX Toolset 3
        run: |
          choco install wixtoolset --no-progress -y
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the EXE installer
        run: .\packaging\windows\build-installer.ps1 -Jdk "$env:JAVA_HOME" -Type exe

      - name: Smoke-test the EXE installer
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dest\windows\*.exe | Select-Object -First 1
          Write-Host "Installing $($exe.FullName)"
          $p = Start-Process $exe.FullName -ArgumentList '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Ramus\Ramus.exe'
          if (-not (Test-Path $installed)) { throw "not found: $installed" }
          Write-Host "Installed: $installed"

      - name: Uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $code = $null
          foreach ($c in $wi.GetType().InvokeMember('Products', 'GetProperty', $null, $wi, $null)) {
              try {
                  $n = $wi.GetType().InvokeMember('ProductInfo', 'GetProperty',
                      $null, $wi, @($c, 'ProductName'))
              } catch { continue }
              if ($n -eq 'Ramus') { $code = $c; break }
          }
          if (-not $code) { throw 'Windows Installer does not know a product named Ramus' }
          Write-Host "ProductCode: $code"
          $p = Start-Process msiexec -ArgumentList @('/x', $code, '/qn') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Ramus'
          if (Test-Path $dir) { throw "the directory survived the uninstall: $dir" }
          Write-Host 'Uninstalled cleanly'

      - uses: actions/upload-artifact@v4
        with:
          name: ramus-windows-exe
          path: dest/windows/*.exe
          if-no-files-found: error
